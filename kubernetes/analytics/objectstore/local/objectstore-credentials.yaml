apiVersion: v1
kind: Secret
metadata:
  name: objectstore-credentials
  namespace: objectstore
type: Opaque
stringData:
  # Silo's root account, consumed by the StatefulSet and the bucket Job. The keys keep
  # their MINIO_ prefix because that is what the Silo binary reads — renaming them
  # would leave the server with no root credentials.
  MINIO_ROOT_USER: "minioadmin"
  MINIO_ROOT_PASSWORD: "minioadmin123"

  # The credentials the CAS disk uses. They are the ROOT keys: Silo service accounts
  # need an `mc admin` call the bucket Job does not make, and this is a local k3d
  # cluster behind no ingress (known shortcut, recorded in docs/cas-local-s3-plan.md §5).
  #
  # The CHI pods need these too, but a Secret cannot be read across namespaces and this
  # layer does not own the `clickhouse` namespace - so the copy they consume lives with
  # its consumer, in kubernetes/analytics/clickhouse/local/objectstore-credentials.yaml.
  # Rotate both together.
  CAS_S3_ACCESS_KEY_ID: "minioadmin"
  CAS_S3_SECRET_ACCESS_KEY: "minioadmin123"
