---
# Single-node Silo. One replica is deliberate: this backend exists to prove CAS
# *semantics* (conditional PUTs, ranged reads, stable ETags), not Silo durability,
# and a distributed Silo would need 4 pods + 4 PVCs on a laptop for no extra signal.
#
# A StatefulSet (not a Deployment) because the S3 data must keep its identity across
# restarts — a Deployment + PVC would let a rolling update run two pods against the
# same RWO volume, which Silo refuses.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: objectstore
  namespace: objectstore
  labels:
    app: objectstore
spec:
  serviceName: objectstore
  replicas: 1
  selector:
    matchLabels:
      app: objectstore
  template:
    metadata:
      labels:
        app: objectstore
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: objectstore
          # Silo, MinIO's community successor: swapped in because it enforces
          # conditional DELETE (`If-Match`), which pgsty/minio ignored and CAS's
          # boot probe rejects the pool without — see scripts/images.mk.
          image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: objectstore-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: objectstore-credentials
                  key: MINIO_ROOT_PASSWORD
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    # 20Gi on the default StorageClass (k3s `local-path`). Sized for the bronze
    # tier in Phase D; the pool is disposable (losing it = reload, nothing precious).
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
